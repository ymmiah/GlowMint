<!DOCTYPE html>
<html lang="en" data-theme="slate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowMint</title>
    <meta name="description" content="GlowMint is an AI-powered photo editing application using the Gemini Nano Banana model to magically transform your images based on text prompts." />
    <meta property="og:title" content="GlowMint" />
    <meta property="og:description" content="GlowMint is an AI-powered photo editing application using the Gemini Nano Banana model to magically transform your images based on text prompts." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/index.css">
    <style>
      body {
        background-color: var(--color-bg);
        background-image: radial-gradient(circle at 1px 1px, rgba(45, 212, 191, 0.1) 1px, transparent 0);
        background-size: 2rem 2rem;
        color: var(--color-text-primary);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      /* Custom scrollbar for a more polished look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-surface-1);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-surface-3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-placeholder);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
